<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Light</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Light: your birth chart, palm and numbers, turned into calm daily guidance.">
<meta name="theme-color" content="#1B1F45">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Light">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Mukta:wght@400;500;600;700&family=Tiro+Devanagari+Hindi&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF0F8;--surface:#FFFFFF;--surface2:#F5F6FC;--ink:#1B1F45;--ink2:#5B6088;--line:rgba(27,31,69,.10);
  --gold:#1B1F45;--on-gold:#FFFFFF;--goldInk:#2F3380;--goldBg:#E6E9F8;--violet:#6558C9;--violetBg:#EEE8FB;--teal:#1F7C8B;--tealBg:#E0F2F4;--rose:#C85A84;
  --serif:'Fraunces','Tiro Devanagari Hindi',Georgia,serif;--sans:'Mukta','Noto Sans Devanagari',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --r-lg:26px;--r:18px;--r-s:12px;--nav:68px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1128;--surface:#1A1D3E;--surface2:#222650;--ink:#EDEBFB;--ink2:#A5A9D0;--line:rgba(237,235,251,.13);--gold:#FFFFFF;--on-gold:#1B1F45;--goldInk:#E4E4FF;--goldBg:#2B2F66;--violet:#A89DF5;--violetBg:#2E2A6B;--teal:#66C6D3;--tealBg:#16363F}}
:root[data-theme="dark"]{--bg:#0F1128;--surface:#1A1D3E;--surface2:#222650;--ink:#EDEBFB;--ink2:#A5A9D0;--line:rgba(237,235,251,.13);--gold:#FFFFFF;--on-gold:#1B1F45;--goldInk:#E4E4FF;--goldBg:#2B2F66;--violet:#A89DF5;--violetBg:#2E2A6B;--teal:#66C6D3;--tealBg:#16363F}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--sans);-webkit-font-smoothing:antialiased;padding-bottom:calc(var(--nav) + env(safe-area-inset-bottom) + 18px)}
body.hi{line-height:1.65}
h1,h2,h3{font-family:var(--serif);font-weight:600;margin:0;letter-spacing:-.01em}
p{margin:0 0 .6em}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,summary:focus-visible,a:focus-visible{outline:3px solid var(--violet);outline-offset:2px;border-radius:10px}
#app{max-width:560px;margin:0 auto;padding:0 16px}
.muted{color:var(--ink2)}.fine{color:var(--ink2);font-size:13.5px;margin-top:10px}.pad{padding:4px 16px 14px}.group>.pad:first-child{padding-top:16px}.label{font-weight:600;margin:14px 0 6px;font-size:15px}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;padding:calc(env(safe-area-inset-top) + 12px) 2px 10px}
.brand{display:flex;align-items:center;gap:8px;font:600 22px var(--serif)}
.top-r{display:flex;gap:10px;align-items:center}
.pill{padding:6px 13px;border-radius:99px;background:var(--surface);border:1px solid var(--line);font-weight:600;font-size:14px;min-width:44px;min-height:34px}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--violet);color:#fff;font-weight:700;font-size:14px;display:grid;place-items:center}
.avatar.big{width:76px;height:76px;font-size:26px;margin:0 auto 10px;font-family:var(--serif)}

/* hero */
.hero{border-radius:var(--r-lg);padding:20px 18px 20px;color:#fff;text-align:center;position:relative;overflow:hidden;margin-bottom:18px}
.sky-night{background:linear-gradient(180deg,#0E1233 0%,#2A2766 100%)}
.sky-dawn{background:linear-gradient(180deg,#34336F 0%,#D9788D 62%,#F7C27A 100%)}
.sky-day{background:linear-gradient(180deg,#4F8FD9 0%,#9ACDF0 100%)}
.sky-dusk{background:linear-gradient(180deg,#2A2A68 0%,#B3578A 58%,#F2A33A 100%)}
.hero-top{text-align:left}.hello{font:600 20px var(--serif);margin:0}.date{margin:2px 0 0;opacity:.85;font-size:14.5px}
.ring{position:relative;width:224px;height:224px;margin:8px auto 4px}
.ring svg{position:absolute;inset:0;width:100%;height:100%}
.ring-bg{fill:none;stroke:rgba(255,255,255,.18);stroke-width:10}
.ring-arc{fill:none;stroke:#FFFFFF;stroke-width:10;stroke-linecap:round;transition:stroke-dashoffset 1.5s cubic-bezier(.2,.8,.2,1)}
.ring-moon{position:absolute;inset:48px}.moon{width:100%;height:100%;display:block}
.level{font-size:38px;line-height:1.1;margin-top:4px}
.level-s{margin:6px auto 12px;max-width:30ch;opacity:.92}
.hero-chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.hero-chips span{background:rgba(255,255,255,.17);backdrop-filter:blur(4px);padding:5px 12px;border-radius:99px;font-size:14px}

/* groups */
.group{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-bottom:14px;overflow:hidden}
.sec-t{padding:16px 16px 8px}.sec-t h2{font-size:21px}.sec-t p{margin:4px 0 0;color:var(--ink2);font-size:14px}
.rows{list-style:none;margin:0;padding:0}
.rows li{display:flex;gap:12px;padding:12px 16px;border-top:1px solid var(--line)}
.rows li:first-child{border-top:0}
.rows.plain li{border-top:0;padding:6px 16px}.rows.plain{padding-bottom:10px}
.rows b{display:block;font-size:16px}.rows em{font-style:normal;color:var(--goldInk);font-weight:600;margin-left:6px}
.rows p{margin:2px 0 0;color:var(--ink2)}.rows.plain p{color:var(--ink);margin:0}
.ic{flex:0 0 36px;height:36px;border-radius:12px;background:var(--goldBg);color:var(--goldInk);display:grid;place-items:center}
.ic svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.rows.plain .ic{flex-basis:26px;height:26px;border-radius:9px;background:var(--tealBg);color:var(--teal)}.rows.plain .ic svg{width:16px;height:16px}
.gentle,.banner{display:flex;gap:12px;background:var(--violetBg);border-radius:var(--r);padding:14px 16px;margin-bottom:14px}
.gentle .ic,.banner .ic{background:var(--surface);color:var(--violet)}
.gentle b,.banner b{display:block}.gentle p,.banner p{margin:2px 0 0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.tile{border-radius:var(--r);padding:14px;border:1px solid var(--line)}
.tile b{display:block;font-size:15px}.tile .t{display:block;font:600 19px var(--serif);margin:4px 0 6px}.tile p{font-size:13.5px;color:var(--ink2);margin:0}
.tile.power{background:var(--goldBg)}.tile.pause{background:var(--tealBg)}
.lucky{display:flex;align-items:center;gap:14px;padding:6px 16px 16px}
.swatch{width:46px;height:46px;border-radius:50%;border:2px solid var(--line);flex:none}
.lucky b{display:block}.lucky p{margin:0;color:var(--ink2);font-size:14px}
.lnum{margin-left:auto;display:flex;gap:6px}.lnum i{font:600 18px var(--serif);font-style:normal;width:36px;height:36px;border-radius:50%;background:var(--violetBg);color:var(--violet);display:grid;place-items:center}
.chapter{padding:2px 16px 14px}.ch-h{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.ch-h b{font:600 19px var(--serif)}.ch-h span{color:var(--ink2);font-size:14px}
.bar{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden;margin:8px 0 10px}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--violet),var(--gold));border-radius:99px}
.link{color:var(--violet);font-weight:600;padding:6px 0;text-decoration:underline;text-underline-offset:3px}
.birthstar{padding:14px 16px}.birthstar b{font:600 18px var(--serif)}.birthstar p{margin:4px 0 0;color:var(--ink2)}
.foot-note{color:var(--ink2);font-size:13px;text-align:center;padding:4px 10px 10px}

/* segmented + sticky */
.stick{position:sticky;top:0;z-index:5;background:var(--bg);padding:6px 0 8px}
.seg{display:flex;background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:4px;gap:2px}
.seg button{flex:1;padding:8px 10px;border-radius:99px;font-weight:600;font-size:14.5px;color:var(--ink2);min-height:40px}
.seg button.on{background:var(--ink);color:var(--bg)}
.seg.gold button.on{background:var(--gold);color:var(--on-gold)}
.seg.wide{margin:14px 0}
.sys{margin:2px 0 12px}
.note-box{display:flex;gap:10px;background:var(--goldBg);color:var(--ink);border:1px solid var(--line);border-radius:var(--r-s);padding:12px 14px;margin-bottom:12px}
.note-box svg{width:20px;height:20px;flex:none;fill:none;stroke:var(--goldInk);stroke-width:1.8;margin-top:2px}.note-box p{margin:0;font-size:14.5px}
.note-box.warn{background:var(--violetBg)}.note-box.warn svg{stroke:var(--violet)}

/* charts */
.chart-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 12px 10px;margin:12px 0 14px}
.chart-card .cap{font-size:13px;color:var(--ink2);text-align:center;margin:8px 6px 0}
.ni{width:100%;height:auto;max-width:420px;display:block;margin:0 auto}
.ni-frame{fill:var(--surface2);stroke:var(--ink2);stroke-width:2}
.ni-h{fill:none;stroke:var(--ink2);stroke-width:1.4}.ni-h.lagna{fill:var(--goldBg)}
.ni-sign{fill:var(--goldInk);font:600 14px var(--sans)}
.ni-pl{fill:var(--ink);font:700 18px var(--sans)}
.wheel{width:100%;height:auto;max-width:440px;display:block;margin:0 auto}
.w-ring{fill:none;stroke:var(--ink2);stroke-width:1.3}.w-line{stroke:var(--ink2);stroke-width:1}
.w-sign{fill:var(--goldInk);font:600 17px var(--sans)}.w-pl{fill:var(--ink);font:600 19px var(--sans)}
.w-axis{stroke:var(--ink);stroke-width:1.8}.w-cusp{stroke:var(--ink2);stroke-width:.8;opacity:.7}
.w-hn{fill:var(--ink2);font:11px var(--sans)}.w-tick{stroke:var(--ink);stroke-width:1.4}.w-lab{fill:var(--ink);font:700 12px var(--sans)}
.w-asp-h{stroke:var(--teal);stroke-width:1.2;opacity:.75}.w-asp-t{stroke:var(--violet);stroke-width:1.2;opacity:.75}
.insight{padding:10px 16px;border-top:1px solid var(--line)}.insight:first-of-type{border-top:0}
.insight b{font:600 17px var(--serif)}.insight p{margin:3px 0 0;color:var(--ink2)}
.tbl-wrap{overflow-x:auto;padding:0 10px 10px}
.tbl{width:100%;border-collapse:collapse;font-size:14.5px}
.tbl small{display:block;color:var(--ink2);font-size:12.5px}.tbl .c{text-align:center}
.tbl th{text-align:left;color:var(--ink2);font-weight:600;font-size:13px;padding:6px 8px;border-bottom:1px solid var(--line)}
.tbl td{padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}.tbl tr:last-child td{border-bottom:0}.tbl sup{color:var(--violet);font-weight:700;margin-left:2px}
.bd{font-style:normal;font-size:12px;font-weight:700;padding:2px 8px;border-radius:99px}
.bd.exalted{background:var(--goldBg);color:var(--goldInk)}.bd.own{background:var(--tealBg);color:var(--teal)}.bd.debilitated{background:var(--violetBg);color:var(--violet)}
.acc details{border-top:1px solid var(--line);padding:0 16px}.acc details:first-child{border-top:0}
.acc summary{list-style:none;display:flex;justify-content:space-between;align-items:center;padding:12px 0;cursor:pointer;font-weight:600;min-height:48px}
.acc summary::-webkit-details-marker{display:none}.acc summary small{color:var(--ink2);font-weight:400;margin-left:auto}
.acc summary::after{content:'+';margin-left:10px;color:var(--ink2);font-size:20px}.acc details[open] summary::after{content:'–'}
.acc details p{margin:0 0 12px;color:var(--ink2)}
.yoga{padding:10px 16px;border-top:1px solid var(--line)}.yoga b{font:600 17px var(--serif);color:var(--goldInk)}.yoga p{margin:2px 0 0;color:var(--ink2)}
.bar-row{display:grid;grid-template-columns:64px 1fr 22px;gap:10px;align-items:center;margin:6px 0}.bar-row span{font-size:14px;color:var(--ink2)}.bar-row .bar{margin:0}.bar-row b{text-align:right}
.asps{padding-bottom:6px}.asp{padding:8px 16px;border-top:1px solid var(--line)}.asp:first-child{border-top:0}.asp b{font-size:15px}.asp small{color:var(--ink2);margin-left:8px}.asp p{margin:2px 0 0;color:var(--ink2);font-size:14.5px}

/* numerology */
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:4px 16px 16px}
.trio div{background:var(--surface2);border-radius:var(--r);padding:14px 6px;text-align:center}
.trio i{display:block;font:600 44px/1 var(--serif);font-style:normal;color:var(--violet)}.trio span{font-size:13.5px;color:var(--ink2)}
.numcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px}
.num-h{display:flex;gap:14px;align-items:center;margin-bottom:8px}
.num-big{font:600 58px/1 var(--serif);color:var(--violet);min-width:52px;text-align:center}
.num-h b{display:block;font-size:16.5px}.num-h small{color:var(--ink2)}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}.kv div{background:var(--surface2);border-radius:var(--r-s);padding:8px 10px}
.kv dt{font-size:12.5px;color:var(--ink2)}.kv dd{margin:2px 0 0;font-weight:600;font-size:14px}
.tip{display:flex;gap:8px;background:var(--tealBg);border-radius:var(--r-s);padding:10px 12px;margin:10px 0 0!important}.tip svg{width:20px;height:20px;flex:none;fill:none;stroke:var(--teal);stroke-width:1.8;margin-top:2px}.tip span{font-size:14.5px}
.letters{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 6px}
.letters span{display:flex;flex-direction:column;align-items:center;background:var(--surface2);border-radius:10px;min-width:34px;padding:4px 6px}.letters b{font-size:16px}.letters i{font-style:normal;font-size:12px;color:var(--violet);font-weight:700}

/* predictions */
.trs{padding:0 12px 12px;display:grid;gap:10px}
.tr{background:var(--surface2);border-radius:var(--r-s);padding:12px 14px;border-left:4px solid var(--teal)}
.tr.care{border-left-color:var(--violet)}
.tr-h{display:flex;align-items:center;gap:10px}.tr-h>div{flex:1;min-width:0}.tr-h b{display:block;font-size:15.5px}.tr-h small{color:var(--ink2);font-size:13px}
.gl{width:34px;height:34px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-size:19px;flex:none;border:1px solid var(--line)}
.tag{font-style:normal;font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px;background:var(--surface);color:var(--ink2);white-space:nowrap}
.tag.ok{background:var(--tealBg);color:var(--teal)}.tag.care{background:var(--violetBg);color:var(--violet)}
.tr p{margin:8px 0 0;font-size:15px}
.events{padding:0 12px 12px;display:grid;gap:10px}
.ev{display:flex;gap:12px;background:var(--surface2);border-radius:var(--r-s);padding:12px}
.ev-d{width:50px;text-align:center;flex:none}.ev-d b{display:block;font:600 26px/1 var(--serif)}.ev-d span{display:block;font-size:13px;color:var(--ink2)}.ev-d small{font-size:11.5px;color:var(--ink2)}
.ev-b{position:relative;padding-left:0;min-width:0}.ev-b>.gl{display:none}.ev-b b{display:block;font-size:15.5px}.ev-b p{margin:4px 0 0;font-size:14.5px;color:var(--ink2)}
.ev.in{border-left:4px solid var(--ink2)}.ev.rx{border-left:4px solid var(--violet)}.ev.dx{border-left:4px solid var(--teal)}
.chaps{padding:0 12px 12px;display:grid;gap:10px}
.chap{background:var(--surface2);border-radius:var(--r-s);padding:12px 14px}.chap.cur{background:var(--goldBg);outline:2px solid var(--gold)}.chap.past{opacity:.7}
.chap-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.chap-h b{font:600 19px var(--serif)}.chap-h span{color:var(--ink2);font-size:14px;margin-left:auto}
.chap small{color:var(--ink2)}.chap p{margin:6px 0 0;font-size:15px}.chap p.muted{font-size:14px}
.ad{list-style:none;margin:0;padding:0 12px 12px}.ad li{display:flex;justify-content:space-between;padding:9px 10px;border-radius:10px}.ad li.cur{background:var(--goldBg);font-weight:600}.ad span{color:var(--ink2);font-size:14px}

/* palm */
.palm-intro{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px 18px;text-align:center}
.palm-art{width:84px;height:84px;margin:0 auto 10px;border-radius:50%;background:var(--goldBg);display:grid;place-items:center;color:var(--goldInk)}.palm-art svg{width:44px;height:44px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.palm-intro h2{font-size:23px;margin-bottom:6px}
.tips{text-align:left;color:var(--ink2);font-size:14.5px;padding-left:20px;margin:12px 0 16px}.tips li{margin:3px 0}
.palm-hero{display:flex;gap:14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;margin:8px 0 14px}
.palm-hero img{width:96px;height:96px;object-fit:cover;border-radius:14px;flex:none}.palm-hero b{font:600 18px var(--serif)}.palm-hero p{margin:4px 0 0;color:var(--ink2);font-size:14.5px}
.lead-p{font-size:17px;line-height:1.55}
.pls{padding:0 12px 12px;display:grid;gap:10px}.pl{background:var(--surface2);border-radius:var(--r-s);padding:12px 14px}
.pl-h{display:flex;justify-content:space-between;align-items:center;gap:8px}.pl-h b{font:600 17px var(--serif)}.pl small{display:block;color:var(--ink2);margin-top:2px}.pl p{margin:6px 0 0}
.mounts{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 12px 12px}.mount{background:var(--surface2);border-radius:var(--r-s);padding:10px 12px}.mount b{font-size:14.5px}.mount p{margin:3px 0 0;font-size:13.5px;color:var(--ink2)}
.busy{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:36px 20px;text-align:center}
.spin{width:44px;height:44px;border-radius:50%;border:4px solid var(--goldBg);border-top-color:var(--violet);margin:0 auto 14px;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}

/* me */
.profile{text-align:center;padding:10px 0 16px}.profile h1{font-size:28px}.profile p{margin:2px 0}
.row-btn{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 20px;border-radius:99px;font-weight:700;min-height:48px;font-size:15.5px}
.btn svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.btn.primary{background:var(--gold);color:var(--on-gold)}.btn.ghost{background:var(--surface);border:1px solid var(--line)}.btn.danger{background:var(--surface);border:1px solid var(--rose);color:var(--rose)}
.about summary{padding:14px 16px;cursor:pointer;font-weight:600}.about p{padding:0 16px;color:var(--ink2);font-size:14.5px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:9px 15px;border-radius:99px;background:var(--surface);border:1px solid var(--line);font-weight:600;font-size:14.5px;min-height:42px}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.field{display:block;margin:14px 0}.field span{display:block;font-weight:600;font-size:14.5px;margin-bottom:6px}
input[type=text],input[type=password],input[type=date],input[type=time],input:not([type]){width:100%;padding:13px 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;min-height:50px}
input:focus{border-color:var(--violet);outline:0;box-shadow:0 0 0 3px var(--violetBg)}
.check{display:flex;gap:10px;align-items:center;margin:10px 0;font-size:15px}.check input{width:22px;height:22px;accent-color:var(--violet)}

/* bottom nav */
#nav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:center;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
#nav:empty{display:none}
#nav button{flex:1;max-width:140px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px 8px;color:var(--ink2);font-size:12.5px;font-weight:600;min-height:var(--nav)}
#nav svg{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;padding:0}
#nav button.on{color:var(--ink)}#nav button.on svg{stroke:var(--goldInk)}
#nav button.on span{border-bottom:2px solid var(--gold)}

/* wizard */
#wizard{position:fixed;inset:0;z-index:50;background:var(--bg);overflow-y:auto}
#wizard[hidden]{display:none}
.wiz-in{max-width:520px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding:calc(env(safe-area-inset-top) + 12px) 20px calc(env(safe-area-inset-bottom) + 18px)}
.wiz-top{display:flex;justify-content:space-between;align-items:center;min-height:44px}
.icon-btn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line)}.icon-btn svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.dots{display:flex;gap:6px}.dots i{width:26px;height:5px;border-radius:9px;background:var(--line)}.dots i.on{background:var(--gold)}
.wiz-body{flex:1;padding:22px 0 12px}.wiz-body h1{font-size:32px;line-height:1.15}.lead{color:var(--ink2);margin:10px 0 8px;font-size:16.5px}
.sun-art{width:230px;height:230px;display:block;margin:26px auto 18px;filter:drop-shadow(0 0 16px rgba(255,255,255,.6)) drop-shadow(0 0 54px rgba(170,180,255,.5))}
.wiz-foot{position:sticky;bottom:0;padding-top:10px;background:linear-gradient(transparent,var(--bg) 30%)}.wiz-foot .btn{width:100%}
.wiz-err{color:var(--rose);font-weight:600;text-align:center;min-height:22px;margin-top:8px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.results{display:grid;gap:8px;margin-top:6px}
.result{display:flex;gap:12px;text-align:left;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-s);padding:12px 14px;min-height:56px}
.result svg,.picked svg{width:22px;height:22px;flex:none;fill:none;stroke:var(--goldInk);stroke-width:1.8}
.result b{display:block}.result small,.picked small{color:var(--ink2);display:block}
.picked{display:flex;gap:12px;align-items:center;background:var(--goldBg);border-radius:var(--r-s);padding:12px 14px;margin-top:10px}
.manual{margin-top:14px}.manual summary{cursor:pointer;color:var(--violet);font-weight:600;padding:8px 0}
#toast{position:fixed;left:50%;bottom:calc(var(--nav) + env(safe-area-inset-bottom) + 14px);transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:99px;font-size:14.5px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:60;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){.ring-arc,#toast,.spin{transition:none;animation:none}}
@media (min-width:600px){body{padding-top:8px}}

/* welcome scene: a white sun on deep indigo */
#wizard.dark{background:radial-gradient(circle at 50% 36%,#3D4296 0%,#232866 38%,#12143A 78%,#0B0D28 100%);color:#fff}
#wizard.dark h1{color:#fff}
#wizard.dark .lead,#wizard.dark .fine{color:rgba(255,255,255,.78)}
#wizard.dark .pill{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.28);color:#fff}
#wizard.dark .seg{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.22)}
#wizard.dark .seg button{color:rgba(255,255,255,.8)}
#wizard.dark .seg button.on{background:#fff;color:#1B1F45}
#wizard.dark .btn.primary{background:#fff;color:#1B1F45}
#wizard.dark .wiz-foot{background:none}
#wizard.dark .wiz-body{text-align:center}
#wizard.dark .wiz-body h1{font-size:34px}
.brand-mark{display:block}

</style>
</head>
<body>
<div id="app"></div>
<nav id="nav" aria-label="Main"></nav>
<div id="wizard" hidden></div>
<div id="toast" role="status" aria-live="polite"></div>

<script>

/* ---------- the white sun ---------- */
function sunSVG() {

}
const BRAND = (() => { let r = ''; for (let i = 0; i < 8; i++) { const ang = i * 45 * Math.PI / 180; r += `<line x1="${(16 + 8.6 * Math.cos(ang)).toFixed(2)}" y1="${(16 + 8.6 * Math.sin(ang)).toFixed(2)}" x2="${(16 + 12 * Math.cos(ang)).toFixed(2)}" y2="${(16 + 12 * Math.sin(ang)).toFixed(2)}"/>`; } return `<svg class="brand-mark" viewBox="0 0 32 32" width="30" height="30" aria-hidden="true"><circle cx="16" cy="16" r="15.5" fill="#1B1F45" stroke="rgba(255,255,255,.28)"/><circle cx="16" cy="16" r="5.4" fill="#fff"/><g stroke="#fff" stroke-width="1.7" stroke-linecap="round">${r}</g></svg>`; })();

/* ---------- calculation bundle (cached) ---------- */
const CACHE = {};
function profileUTC(p) { const [y, m, d] = p.dob.split('-').map(Number); const [hh, mm] = (p.tob || '12:00').split(':').map(Number); return AC.localToUTC(y, m, d, hh, mm, p.place.tz); }
function bundle(p) {
  const key = [p.id, p.dob, p.tob, p.place.lat, p.place.lon, p.place.tz].join('|');
  if (!CACHE[key]) {
    const chart = AC.computeChart({ utc: profileUTC(p), lat: +p.place.lat, lon: +p.place.lon, timeKnown: !!p.tob });
    CACHE[key] = { chart, vedic: AC.vedicChart(chart), western: AC.westernChart(chart) };
  }
  const b = CACHE[key];
  const [y, m, d] = p.dob.split('-').map(Number);
  return Object.assign({}, b, { num: AC.numerology(d, m, y, p.name, p.birthName, new Date()) });
}
function curLoc(p) { const l = S.settings.loc; if (l && l.lat != null) return l; return { lat: +p.place.lat, lon: +p.place.lon, name: p.place.name }; }
const fieldInfo = (id) => C.fields.find((f) => f[0] === id) || C.fields[C.fields.length - 1];

const greet = () => { const h = new Date().getHours(); return h < 5 ? L('Good night', 'शुभ रात्रि') : h < 12 ? L('Good morning', 'शुभ प्रभात') : h < 17 ? L('Good afternoon', 'शुभ अपराह्न') : L('Good evening', 'शुभ संध्या'); };
const initials = (n) => (n || '?').trim().split(/\s+/).map((w) => w[0]).slice(0, 2).join('').toUpperCase();

/* ---------- theme / shell ---------- */
function applyTheme() { document.documentElement.dataset.theme = S.theme === 'auto' ? '' : S.theme; document.documentElement.lang = LANG === 'hi' ? 'hi' : 'en'; document.body.classList.toggle('hi', LANG === 'hi'); }

/* ---------- wizard ---------- */

document.addEventListener('click', (e) => {

});
document.addEventListener('input', (e) => {

document.addEventListener('change', (e) => {

<script>

/* ---------- moon + ring ---------- */
function moonSVG(phase, r = 40) {
  const cx = 60, cy = 60, rad = phase * Math.PI / 180, cosp = Math.cos(rad), k = (1 - cosp) / 2, rx = (r * Math.abs(cosp)).toFixed(2), waxing = phase < 180, crescent = k < 0.5;
  let sweepLimb = waxing ? 1 : 0, sweepTerm = waxing ? (crescent ? 0 : 1) : (crescent ? 1 : 0);

const skyPhase = (now, w) => { const t = now.getTime(), r = w.rise.getTime(), s = w.set.getTime(), m = 45 * 60000; if (t < r - m || t > s + m) return 'night'; if (t < r + m) return 'dawn'; if (t > s - m) return 'dusk'; return 'day'; };

/* ---------- North Indian chart ---------- */
const NI = [
  { p: '100,100 200,0 300,100 200,200', c: [200, 100] }, { p: '0,0 200,0 100,100', c: [100, 34] }, { p: '0,0 100,100 0,200', c: [34, 100] }, { p: '0,200 100,100 200,200 100,300', c: [100, 200] },
  { p: '0,200 100,300 0,400', c: [34, 300] }, { p: '0,400 100,300 200,400', c: [100, 366] }, { p: '100,300 200,200 300,300 200,400', c: [200, 300] }, { p: '200,400 300,300 400,400', c: [300, 366] },
  { p: '400,400 300,300 400,200', c: [366, 300] }, { p: '400,200 300,300 200,200 300,100', c: [300, 200] }, { p: '400,200 300,100 400,0', c: [366, 100] }, { p: '400,0 300,100 200,0', c: [300, 34] },
];
function northChart(base, items) { // base: sign index of house 1; items: [{sign, label}]
  let svg = `<svg class="ni" viewBox="-6 -6 412 412" role="img" aria-label="${L('Birth chart', 'जन्म कुंडली')}"><rect x="0" y="0" width="400" height="400" class="ni-frame"/>`;
  NI.forEach((h, i) => {
    const sign = (base + i) % 12, here = items.filter((x) => x.sign === sign);
    svg += `<polygon points="${h.p}" class="ni-h ${i === 0 ? 'lagna' : ''}"/>`;
    const per = (i === 0 || i === 3 || i === 6 || i === 9) ? 3 : 2, lines = []; for (let k = 0; k < here.length; k += per) lines.push(here.slice(k, k + per));
    const [cx, cy] = h.c, dx = 200 - cx, dy = 200 - cy, dist = Math.hypot(dx, dy) || 1, nx = cx + dx / dist * 30, ny = cy + dy / dist * 30 + 4;
    svg += `<text x="${nx.toFixed(0)}" y="${ny.toFixed(0)}" class="ni-sign" text-anchor="middle">${sign + 1}</text>`;
    const y0 = cy - (lines.length - 1) * 8 - 2;
    lines.forEach((ln, j) => { svg += `<text x="${cx}" y="${(y0 + j * 17).toFixed(0)}" class="ni-pl" text-anchor="middle">${ln.map((x) => esc(x.label)).join(' ')}</text>`; });
  });
  return svg + '</svg>';
}
const abbr = (pl) => P(C.planetAbbr[pl]);

/* ---------- Western wheel ---------- */
function wheelChart(ch, w) {
  const cx = 200, cy = 200, asc = ch.asc, ang = (lon) => (180 + (lon - asc)) * Math.PI / 180;
  const pt = (lon, r) => [cx + r * Math.cos(ang(lon)), cy - r * Math.sin(ang(lon))];
  const f = (n) => n.toFixed(1);
  let s = `<svg class="wheel" viewBox="0 0 400 400" role="img" aria-label="${L('Birth wheel', 'जन्म चक्र')}"><circle cx="200" cy="200" r="192" class="w-ring"/><circle cx="200" cy="200" r="158" class="w-ring"/><circle cx="200" cy="200" r="70" class="w-ring"/>`;
  for (let i = 0; i < 12; i++) {
    const a = pt(i * 30, 192), b = pt(i * 30, 158), m = pt(i * 30 + 15, 175);
    s += `<line x1="${f(a[0])}" y1="${f(a[1])}" x2="${f(b[0])}" y2="${f(b[1])}" class="w-line"/><text x="${f(m[0])}" y="${f(m[1] + 6)}" class="w-sign" text-anchor="middle">${C.signGlyph[i]}\uFE0E</text>`;
  }
  for (let i = 1; i <= 12; i++) {
    const l = ch.cusps[i], a = pt(l, 158), b = pt(l, 70), axis = i === 1 || i === 4 || i === 7 || i === 10;
    s += `<line x1="${f(a[0])}" y1="${f(a[1])}" x2="${f(b[0])}" y2="${f(b[1])}" class="${axis ? 'w-axis' : 'w-cusp'}"/>`;
    const mid = l + (((ch.cusps[i % 12 + 1] - l + 360) % 360) / 2), m = pt(mid, 84); s += `<text x="${f(m[0])}" y="${f(m[1] + 3)}" class="w-hn" text-anchor="middle">${i}</text>`;
  }
  // aspects
  const keys = AC.BODIES.slice(0, 10), pos = {}; keys.forEach((k) => (pos[k] = w.planets[k].lon));
  w.aspects.filter((a) => a.type !== 'conjunction' && pos[a.a] != null && pos[a.b] != null).forEach((a) => {
    const p1 = pt(pos[a.a], 68), p2 = pt(pos[a.b], 68), cls = (a.type === 'trine' || a.type === 'sextile') ? 'w-asp-h' : 'w-asp-t';
    s += `<line x1="${f(p1[0])}" y1="${f(p1[1])}" x2="${f(p2[0])}" y2="${f(p2[1])}" class="${cls}"/>`;
  });
  // planets with spreading
  const arr = keys.map((k) => ({ k, lon: pos[k], d: pos[k] })).sort((a, b) => a.lon - b.lon);
  for (let it = 0; it < 30; it++) for (let i = 0; i < arr.length; i++) { const a = arr[i], b = arr[(i + 1) % arr.length], gap = ((b.d - a.d + 360) % 360); if (gap < 10) { const push = (10 - gap) / 2; a.d -= push; b.d += push; } }
  arr.forEach((o) => {
    const t = pt(o.lon, 158), g = pt(o.d, 132), tx = pt(o.lon, 150);
    s += `<line x1="${f(t[0])}" y1="${f(t[1])}" x2="${f(tx[0])}" y2="${f(tx[1])}" class="w-tick"/><text x="${f(g[0])}" y="${f(g[1] + 6)}" class="w-pl" text-anchor="middle">${C.planetGlyph[o.k]}\uFE0E</text>`;
  });
  const a = pt(asc, 205), mcp = pt(ch.mc, 205);
  s += `<text x="${f(a[0] - 2)}" y="${f(a[1] + 3)}" class="w-lab" text-anchor="end">AC</text><text x="${f(mcp[0])}" y="${f(mcp[1] - 4)}" class="w-lab" text-anchor="middle">MC</text>`;
  return s + '</svg>';
}

    const aff = fi[2], strong = aff.filter((k) => { const x = v.planets[k]; return x.dignity === 'own' || x.dignity === 'exalted' || [1, 4, 5, 7, 9, 10, 11].includes(x.house); });

  } else {
    const w = b.western, in10 = AC.BODIES.filter((k) => w.planets[k].house === 10);
    out.push(L(`Your Midheaven is in ${signShort(w.mcSign, 'w')}: your public calling is marked by ${P(C.westSign[w.mcSign])}.`, `आपका दशम शिखर ${signShort(w.mcSign, 'w')} में है: आपकी सार्वजनिक पहचान ${P(C.westSign[w.mcSign])} से बनती है।`));
    if (in10.length) out.push(L(`${join(in10.map(planetName))} in your 10th house bring ${join(in10.map(gift))} into your career.`, `आपके दशम भाव में ${join(in10.map(planetName))} आपके करियर में ${join(in10.map(gift))} लाते हैं।`));
  }
  out.push(L(`Your Moolank ${num.moolank} suits ${P(C.num[num.moolank].career)}.`, `आपका मूलांक ${num.moolank} इनके अनुकूल है: ${P(C.num[num.moolank].career)}।`));
  const fc = C.focus[p.focus || 'grow'];

  <p class="foot-note">${L('Astrology offers reflection, not certainty. Please make career and money decisions on facts, advice and your own judgement.', 'ज्योतिष चिंतन देता है, निश्चितता नहीं। करियर और धन के निर्णय तथ्यों, सलाह और अपने विवेक से लें।')}</p>`;
}

  <section class="group">${sectionTitle(L('Appearance', 'रूप'))}<div class="pad">${seg('theme', [['auto', L('Auto', 'ऑटो')], ['light', L('Light', 'हल्का')], ['dark', L('Dark', 'गहरा')]], S.theme, 'theme')}</div></section>
  <section class="group">${sectionTitle(L('Your data', 'आपका डेटा'), L('Stored only on this device. Back it up before changing phones.', 'केवल इसी डिवाइस पर रहता है। फ़ोन बदलने से पहले बैकअप लें।'))}<div class="pad row-btn"><button class="btn ghost" data-act="backup">${L('Download backup', 'बैकअप डाउनलोड करें')}</button><button class="btn ghost" data-act="restore">${L('Restore backup', 'बैकअप वापस लाएँ')}</button>${S.profiles.length ? `<button class="btn danger" data-act="delperson">${L('Remove this person', 'इन्हें हटाएँ')}</button>` : ''}</div></section>
  <section class="group"><details class="about"><summary>${L('How Light calculates', 'लाइट गणना कैसे करती है')}</summary><p>${L('Planet positions come from the astronomy-engine library (VSOP87 and lunar theory), accurate to about an arc-minute. Vedic charts are sidereal with the Lahiri ayanamsa, whole-sign houses, mean Rahu and Ketu and the Vimshottari dasha. Western charts are tropical with Placidus houses. Daily guidance uses Chandrabala and Tarabala from your birth star. Numerology follows the Indian method with Chaldean name values. Palm readings are AI interpretations of your photo.', 'ग्रहों की स्थिति astronomy-engine लाइब्रेरी (VSOP87 और चंद्र सिद्धांत) से आती है, जो लगभग एक कला-मिनट तक सटीक है। वैदिक कुंडली निरयन है: लाहिड़ी अयनांश, राशि-भाव, माध्य राहु-केतु और विंशोत्तरी दशा। पाश्चात्य कुंडली सायन है, प्लासिडस भावों के साथ। दैनिक मार्गदर्शन आपके जन्म-नक्षत्र से चंद्रबल और ताराबल पर आधारित है। अंकशास्त्र भारतीय पद्धति और कैल्डियन नाम-मानों का पालन करता है। हस्तरेखा आपकी फ़ोटो की AI व्याख्या है।')}</p><p>${L('Light is for reflection and inspiration. It is not medical, legal or financial advice.', 'लाइट चिंतन और प्रेरणा के लिए है। यह चिकित्सा, कानूनी या वित्तीय सलाह नहीं है।')}</p></details></section>
  <input type="file" id="restoreFile" accept="application/json" hidden>`;
};

function palmAccessSection() {
  const keyForm = `<label class="field"><span>API key</span><input id="apikey" type="password" autocomplete="off" placeholder="sk-ant-…" value="${esc(S.settings.apiKey)}"></label><label class="field"><span>${L('Model', 'मॉडल')}</span><input id="model" value="${esc(S.settings.model)}"></label><button class="btn primary" data-act="savekey">${L('Save', 'सहेजें')}</button><p class="fine">${L('Get a key at console.anthropic.com. Each analysis costs a few cents. The key stays on this phone and is sent only to Anthropic.', 'console.anthropic.com पर कुंजी बनाएँ। हर विश्लेषण पर कुछ सेंट का खर्च आता है। कुंजी इसी फ़ोन में रहती है और केवल Anthropic को भेजी जाती है।')}</p>`;
  const proxied = !!(window.LIGHT_CONFIG && window.LIGHT_CONFIG.proxyUrl);
  if (!proxied) return `<section class="group">${sectionTitle(L('Palm analysis key', 'पाम विश्लेषण की कुंजी'), L('Your own Anthropic API key. It stays on this phone and is sent only to Anthropic when you analyse a palm photo.', 'आपकी अपनी Anthropic API कुंजी। यह इसी फ़ोन में रहती है और पाम फ़ोटो का विश्लेषण करते समय ही Anthropic को भेजी जाती है।'))}<div class="pad">${keyForm}</div></section>`;
  return `<section class="group">${sectionTitle(L('Palm reading access', 'हस्तरेखा एक्सेस'), L('Enter the access code you were given. Your palm photo is sent securely for analysis and is not stored.', 'आपको दिया गया एक्सेस कोड भरें। आपकी पाम फ़ोटो विश्लेषण के लिए सुरक्षित रूप से भेजी जाती है और सहेजी नहीं जाती।'))}
    <div class="pad"><label class="field"><span>${L('Access code', 'एक्सेस कोड')}</span><input id="acode" autocomplete="off" autocapitalize="none" value="${esc(S.settings.code || '')}"></label><button class="btn primary" data-act="savecode">${L('Save', 'सहेजें')}</button>
    <details class="manual"><summary>${L('Use my own API key instead', 'इसके बजाय अपनी API कुंजी उपयोग करें')}</summary>${keyForm}</details></div></section>`;
}

<script>
/* Light — palm reading (photo + AI analysis with the user's own API key) */
'use strict';
const PALM_SYSTEM = `You are a warm, thoughtful palmistry guide inside a self-reflection app. You read a photo of a person's palm using traditional Indian (Samudrik Shastra) and Western palmistry frameworks.
Rules: Be honest about what is actually visible; if a line is faint, unclear or hidden by lighting, say so and lower your confidence. Never predict death, illness, accidents, divorce, or any misfortune, and never give medical advice. Frame everything as tendencies, strengths and growth areas, in a calm, encouraging, second-person voice. Do not claim certainty.
Respond with ONE minified JSON object only. No markdown, no commentary.`;

function palmPrompt(p, hand, langName) {
  const age = Math.max(1, Math.floor((Date.now() - new Date(p.dob).getTime()) / (365.25 * 86400000)));
  return `Analyse this ${hand} palm (the person's ${hand === p.hand ? 'dominant' : 'non-dominant'} hand). Person: age ${age}, works in "${fieldInfo(p.field)[1][0]}"${p.role ? ` as ${p.role}` : ''}.
Write every text value in ${langName}. Keep each text value to 1-2 short sentences.
If the image is not a clear human palm, return {"ok":false,"reason":"<one friendly sentence on how to retake the photo>"}.
Otherwise return exactly this shape:
{"ok":true,"photoQuality":"poor|fair|good","handShape":{"element":"earth|air|fire|water","note":""},"lines":[{"key":"life","visible":true,"strength":"faint|clear|deep","observation":"","meaning":""},{"key":"head",...},{"key":"heart",...},{"key":"fate",...},{"key":"sun",...}],"mounts":[{"key":"jupiter|saturn|apollo|mercury|venus|mars|moon","prominence":"flat|average|full","meaning":""}],"standout":"the single most distinctive feature","summary":"3 sentences, warm and specific","strengths":["",""],"growth":["",""],"careerNote":"one sentence relevant to their work","confidence":"low|medium|high"}
Include all five lines and as many mounts as you can see. Enum values must stay in English; only text values use ${langName}.`;
}

const proxyUrl = () => (window.LIGHT_CONFIG && window.LIGHT_CONFIG.proxyUrl) || '';
const useProxy = () => !!(proxyUrl() && S.settings.code);
const palmReady = () => useProxy() || !!S.settings.apiKey;
async function callProxy(payload) {
  const r = await fetch(proxyUrl(), { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(Object.assign({ code: S.settings.code }, payload)) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) { const e = new Error(j.error || 'HTTP ' + r.status); e.kind = j.error; e.limit = j.limit; throw e; }
  const m = (j.text || '').match(/\{[\s\S]*\}/); if (!m) throw new Error('parse');
  return JSON.parse(m[0]);
}
function resizeImage(file, max, q) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), img = new Image();
    img.onload = () => {
      const s = Math.min(1, max / Math.max(img.width, img.height)), c = document.createElement('canvas');
      c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url); res(c.toDataURL('image/jpeg', q));
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('image')); };
    img.src = url;
  });
}
async function callClaude(content, maxTokens) {
  const key = S.settings.apiKey;
  const r = await fetch('https://api.anthropic.com/v1/messages', {
    method: 'POST',
    headers: { 'content-type': 'application/json', 'x-api-key': key, 'anthropic-version': '2023-06-01', 'anthropic-dangerous-direct-browser-access': 'true' },
    body: JSON.stringify({ model: S.settings.model || 'claude-sonnet-5-5', max_tokens: maxTokens, system: PALM_SYSTEM, messages: [{ role: 'user', content }] }),
  });
  if (!r.ok) { let m = ''; try { m = (await r.json()).error.message; } catch (e) {} const err = new Error(m || 'HTTP ' + r.status); err.status = r.status; throw err; }
  const j = await r.json(), txt = (j.content || []).map((x) => x.text || '').join('');
  const m = txt.match(/\{[\s\S]*\}/); if (!m) throw new Error('parse');
  return JSON.parse(m[0]);
}
function palmFail(e) {
  ui.palmBusy = false;
  ui.palmErr = e.kind === 'bad_code' ? L('That access code was not accepted. Check it in the Me tab.', 'यह एक्सेस कोड स्वीकार नहीं हुआ। मैं टैब में जाँचें।')
    : e.kind === 'limit' ? L(`You have reached today’s limit of ${e.limit || 'a few'} palm readings. Please try again tomorrow.`, `आज की ${e.limit || 'कुछ'} हस्तरेखा विश्लेषणों की सीमा पूरी हो गई। कृपया कल फिर कोशिश करें।`)
    : e.kind === 'limit_global' ? L('Palm readings are paused for today because the shared daily limit was reached. Please try again tomorrow.', 'आज की साझा सीमा पूरी होने से हस्तरेखा विश्लेषण रुका है। कृपया कल फिर कोशिश करें।')
    : e.kind === 'upstream' || e.kind === 'not_configured' ? L('The palm reading service is not available right now. Please try again later.', 'हस्तरेखा सेवा अभी उपलब्ध नहीं है। कृपया बाद में कोशिश करें।')
    : e.kind === 'bad_image' ? L('That photo could not be used. Please retake it.', 'यह फ़ोटो उपयोग नहीं हो सकी। कृपया फिर से लें।')
    : e.status === 401 ? L('Your API key was not accepted. Check it in the Me tab.', 'आपकी API कुंजी स्वीकार नहीं हुई। मैं टैब में जाँचें।')
    : e.status === 429 ? L('Too many requests right now. Wait a minute and try again.', 'अभी बहुत अनुरोध हैं। एक मिनट रुककर फिर कोशिश करें।')
    : e.status === 404 ? L('That model name was not found. Check the Model field in the Me tab.', 'यह मॉडल नहीं मिला। मैं टैब में मॉडल का नाम जाँचें।')
    : e.message === 'parse' ? L('The reading came back in an unexpected format. Please try again.', 'विश्लेषण अप्रत्याशित रूप में आया। कृपया फिर कोशिश करें।')
    : L('Could not reach the analysis service. Check your internet and try again.', 'विश्लेषण सेवा तक नहीं पहुँच सके। इंटरनेट जाँचें और फिर कोशिश करें।');
  render();
}
function palmPick(kind) {
  const p = me();
  if (!palmReady()) { ui.palmErr = proxyUrl() ? L('Enter your access code in the Me tab first, then come back to analyse your palm.', 'पहले मैं टैब में अपना एक्सेस कोड भरें, फिर पाम का विश्लेषण करें।') : L('Add your API key first, then come back to analyse your palm.', 'पहले अपनी API कुंजी जोड़ें, फिर पाम का विश्लेषण करें।'); ui.tab = 'me'; render(); return toast(ui.palmErr); }
  const i = document.createElement('input'); i.type = 'file'; i.accept = 'image/*'; if (kind === 'camera') i.setAttribute('capture', 'environment');
  i.onchange = () => { if (i.files && i.files[0]) palmRun(i.files[0]); };
  i.click();
}
async function palmRun(file) {
  const p = me(), hand = ui.palmHand || p.hand || 'right';
  ui.palmBusy = true; ui.palmErr = ''; render();
  try {
    const big = await resizeImage(file, 1280, 0.85), thumb = await resizeImage(file, 280, 0.7);
    const age = Math.max(1, Math.floor((Date.now() - new Date(p.dob).getTime()) / (365.25 * 86400000)));
    const data = useProxy()
      ? await callProxy({ mode: 'palm', image: big.split(',')[1], hand, dominant: hand === p.hand, age, field: fieldInfo(p.field)[1][0], role: p.role || '', lang: LANG })
      : await callClaude([{ type: 'image', source: { type: 'base64', media_type: 'image/jpeg', data: big.split(',')[1] } }, { type: 'text', text: palmPrompt(p, hand, LANG === 'hi' ? 'Hindi (Devanagari script)' : 'English') }], 2200);
    ui.palmBusy = false;
    if (!data.ok) { ui.palmErr = data.reason || L('We could not see a clear palm. Please retake the photo.', 'हथेली साफ़ नहीं दिखी। कृपया फ़ोटो फिर लें।'); return render(); }
    p.palm = p.palm || {}; p.palm[hand] = { data, thumb, at: Date.now(), lang: LANG }; save(); render(); toast(L('Palm reading ready.', 'हस्तरेखा विश्लेषण तैयार है।'));
  } catch (e) { palmFail(e); }
}
ACTIONS.palmtr = async function () {
  const p = me(), hand = ui.palmHand || p.hand || 'right', r = p.palm && p.palm[hand]; if (!r || !palmReady()) return;
  ui.palmBusy = true; render();
  try {
    const target = LANG === 'hi' ? 'Hindi (Devanagari script)' : 'English';
    const data = useProxy() ? await callProxy({ mode: 'translate', json: r.data, lang: LANG }) : await callClaude([{ type: 'text', text: `Translate every human-readable string value of this JSON into ${target}. Keep all keys and the enum values (element, strength, prominence, confidence, photoQuality, key, and booleans) exactly unchanged. Return the JSON only.\n${JSON.stringify(r.data)}` }], 2200);
    r.data = data; r.lang = LANG; save(); ui.palmBusy = false; render();
  } catch (e) { palmFail(e); }
};

function palmView(p) {
  const hand = ui.palmHand || p.hand || 'right', res = p.palm && p.palm[hand];
  const hs = `<div class="sys"><div class="seg" role="group"><button class="${hand === 'right' ? 'on' : ''}" data-act="palmhand" data-v="right">${L('Right hand', 'दायाँ हाथ')}${p.hand === 'right' ? ' ★' : ''}</button><button class="${hand === 'left' ? 'on' : ''}" data-act="palmhand" data-v="left">${L('Left hand', 'बायाँ हाथ')}${p.hand === 'left' ? ' ★' : ''}</button></div></div>`;
  const err = ui.palmErr ? `<div class="note-box warn">${ICON.clock}<p>${esc(ui.palmErr)}</p></div>` : '';
  if (ui.palmBusy) return hs + `<section class="busy"><div class="spin" aria-hidden="true"></div><b>${L('Reading your palm…', 'आपकी हथेली पढ़ी जा रही है…')}</b><p>${L('This takes about 15 seconds.', 'इसमें लगभग 15 सेकंड लगते हैं।')}</p></section>`;
  const pick = (label) => `<div class="row-btn"><button class="btn primary" data-act="palmpick" data-v="camera">${ICON.camera}${label || L('Take a photo', 'फ़ोटो लें')}</button><button class="btn ghost" data-act="palmpick" data-v="gallery">${ICON.image}${L('Choose a photo', 'फ़ोटो चुनें')}</button></div>`;
  if (!res) {
    return hs + err + `<section class="palm-intro"><div class="palm-art" aria-hidden="true">${ICON.hand}</div><h2>${L('Add your palm', 'अपनी हथेली जोड़ें')}</h2>
    <p>${L('One clear photo is enough. Light looks at your life, head, heart, fate and sun lines, the mounts and the shape of your hand.', 'एक साफ़ फ़ोटो काफ़ी है। लाइट आपकी जीवन, मस्तिष्क, हृदय, भाग्य और सूर्य रेखाओं, पर्वतों और हाथ के आकार को देखती है।')}</p>
    <ul class="tips"><li>${L('Use daylight, no flash glare.', 'दिन की रोशनी लें, फ़्लैश की चमक नहीं।')}</li><li>${L('Open the palm flat, fingers slightly apart.', 'हथेली सपाट खोलें, उँगलियाँ थोड़ी अलग।')}</li><li>${L('Include the wrist crease and all fingertips.', 'कलाई की रेखा और सभी उँगलियों के सिरे फ़्रेम में रखें।')}</li><li>${L('Hold the camera straight above, about 25 cm away.', 'कैमरा सीधे ऊपर, लगभग 25 सेमी दूर रखें।')}</li></ul>
    ${pick()}${palmReady() ? '' : `<p class="fine">${proxyUrl() ? L('Enter the access code you were given in the Me tab to unlock palm reading.', 'हस्तरेखा खोलने के लिए आपको दिया गया एक्सेस कोड मैं टैब में भरें।') : L('You need your own API key for this step. Add it in the Me tab.', 'इस चरण के लिए आपकी अपनी API कुंजी चाहिए। इसे मैं टैब में जोड़ें।')}</p>`}</section>`;
  }
  const R = res.data, ql = { faint: L('Light', 'हल्की'), clear: L('Clear', 'स्पष्ट'), deep: L('Deep', 'गहरी') };
  const lines = (R.lines || []).map((l) => `<article class="pl"><div class="pl-h"><b>${P(C.palmLines[l.key] || [l.key, l.key])}</b><em class="tag ${l.visible === false ? '' : 'ok'}">${l.visible === false ? L('Not clear in photo', 'फ़ोटो में स्पष्ट नहीं') : ql[l.strength] || ''}</em></div>${l.observation ? `<small>${esc(l.observation)}</small>` : ''}<p>${esc(l.meaning || '')}</p></article>`).join('');
  const mounts = (R.mounts || []).filter((m) => C.palmMounts[m.key]).map((m) => `<div class="mount"><b>${P(C.palmMounts[m.key])}</b><p>${esc(m.meaning || '')}</p></div>`).join('');
  const li = (a) => (a || []).map((x) => `<li><span class="ic">${ICON.check}</span><div><p>${esc(x)}</p></div></li>`).join('');
  const conf = { low: L('Low', 'कम'), medium: L('Medium', 'मध्यम'), high: L('High', 'उच्च') }[R.confidence] || '';
  return hs + err + `<section class="palm-hero">${res.thumb ? `<img src="${res.thumb}" alt="${L('Your palm', 'आपकी हथेली')}">` : ''}<div><b>${L('Hand type', 'हाथ का प्रकार')}: ${R.handShape ? P(C.element[R.handShape.element] || ['', '']) : ''}</b><p>${esc(R.handShape ? R.handShape.note : '')}</p></div></section>
  <section class="group"><div class="pad"><p class="lead-p">${esc(R.summary || '')}</p>${R.standout ? `<p class="muted"><b>${L('Most distinctive', 'सबसे विशिष्ट')}:</b> ${esc(R.standout)}</p>` : ''}</div></section>
  <section class="group">${sectionTitle(L('Your lines', 'आपकी रेखाएँ'))}<div class="pls">${lines}</div></section>
  ${mounts ? `<section class="group">${sectionTitle(L('Your mounts', 'आपके पर्वत'))}<div class="mounts">${mounts}</div></section>` : ''}
  <section class="group">${sectionTitle(L('Strengths', 'शक्तियाँ'))}<ul class="rows plain">${li(R.strengths)}</ul></section>
  <section class="group">${sectionTitle(L('Room to grow', 'विकास के अवसर'))}<ul class="rows plain">${li(R.growth)}</ul>${R.careerNote ? `<div class="pad"><p><b>${L('For your work', 'आपके काम के लिए')}:</b> ${esc(R.careerNote)}</p></div>` : ''}</section>
  <section class="group"><div class="pad"><p class="muted">${L('Photo quality', 'फ़ोटो की गुणवत्ता')}: ${({ poor: L('poor', 'कमज़ोर'), fair: L('fair', 'ठीक-ठाक'), good: L('good', 'अच्छी') })[R.photoQuality] || ''} · ${L('Confidence', 'विश्वसनीयता')}: ${conf} · ${fmtDate(new Date(res.at))}</p>
    ${res.lang !== LANG ? `<button class="btn ghost" data-act="palmtr">${L('Show in English', 'हिन्दी में दिखाएँ')}</button>` : ''}${pick(L('Retake and re-read', 'फिर से फ़ोटो लें और पढ़ें'))}<button class="link" data-act="palmclear">${L('Remove this reading', 'यह विश्लेषण हटाएँ')}</button></div></section>
  <p class="foot-note">${L('Palm reading here is an AI interpretation for reflection and fun, not a prediction.', 'यहाँ हस्तरेखा विश्लेषण चिंतन और आनंद के लिए AI की व्याख्या है, भविष्यवाणी नहीं।')}</p>`;
}

</script>
<script>if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}</script>
</body>
</html>
